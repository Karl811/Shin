<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F5F7FD">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>Shin routine</title>
<meta name="application-name" content="Shin du ký">
<meta name="apple-mobile-web-app-title" content="Shin du ký">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">



<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* ===== TOKEN · TQ04: theo phong cách CD49 (giấy ấm, xanh sang, vé tàu) ===== */
:root{
  color-scheme:light;
  --c:#2A74DB; --c-d:#1D5FD1; --c-dd:#163E8C; --c-t:#E5EFFC; --c-t2:#CFE0F8;
  --y:#F2B21B; --y-d:#C98A0B; --y-t:#FFF4D6;
  --seal:#C8372D;
  --ink:#1E2230; --ink-2:#4A4F5E; --muted:#7A7F8C; --rule:#E6E1D6; --card:#fff; --bg:#FBF8F2;
  --tkp:#FFFDF8; --tkb:#D9D2C2; --tkl:#E9E3D4; --stub:#F6F2E8;
  --ok:#22A05E; --ok-t:#E3F5EA; --no:#DE3F35; --no-t:#FCE7E5;
  --fire:#F07F1E; --xp:#D99A0B; --xp-t:#FFF3D1; --ins:#7A55D3; --ins-t:#EFEAFB;
  --l1:#C98B5B; --l2:#9DA9BC; --l3:#E3A916;
  --paper:#FBF4E2; --paper-d:#EADCB8;
  --rainbow:linear-gradient(90deg,#F07F1E,#E0567F,#7A55D3,#22A05E,#2A74DB,#0F9F98);
  --f:"Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --h:"Be Vietnam Pro",system-ui,sans-serif;
  --jp:"Noto Sans JP","Hiragino Sans","Yu Gothic","Meiryo",sans-serif;
  --ease:cubic-bezier(.32,.72,0,1);
  --sh:0 12px 30px -16px rgba(30,34,48,.35);
}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;height:100%;background:var(--bg)}
body{margin:0;min-height:100%;color:var(--ink);font-family:var(--f);font-size:16px;line-height:1.6;font-weight:400;
  background:radial-gradient(900px 520px at -8% -6%, rgba(240,127,30,.12), transparent 60%),radial-gradient(800px 560px at 108% 8%, rgba(122,85,211,.10), transparent 60%),radial-gradient(900px 600px at 50% 112%, rgba(15,159,152,.09), transparent 60%),var(--bg);
  background-attachment:fixed;-webkit-tap-highlight-color:transparent}
b,strong{font-weight:600}
button{font-family:inherit;color:inherit}
:focus-visible{outline:3px solid var(--c);outline-offset:2px;border-radius:10px}
[tabindex="-1"]:focus,[tabindex="-1"]:focus-visible{outline:none}
.jp{font-family:var(--jp);font-weight:500}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
h1,h2,h3{font-family:var(--h);line-height:1.15;margin:0;letter-spacing:-.02em;font-weight:600}
h1{font-size:28px}h2{font-size:20px}h3{font-size:17px}
p{margin:0 0 10px}
.wrap{max-width:640px;margin:0 auto;padding:0 18px}
main{padding:calc(66px + env(safe-area-inset-top,0px)) 0 calc(104px + env(safe-area-inset-bottom,0px));min-height:100vh}
body.demo main{padding-top:calc(92px + env(safe-area-inset-top,0px))}
.muted{color:var(--muted)}.small{font-size:13.5px}.tiny{font-size:12px}.center{text-align:center}
.enter>*{animation:up .55s var(--ease) both}
.enter>*:nth-child(2){animation-delay:.07s}.enter>*:nth-child(3){animation-delay:.14s}.enter>*:nth-child(4){animation-delay:.21s}.enter>*:nth-child(n+5){animation-delay:.28s}
@keyframes up{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}

/* ===== Thương hiệu (trái trên) · điểm (phải trên) ===== */
.brand{position:fixed;z-index:50;top:calc(12px + env(safe-area-inset-top,0px));left:12px;display:flex;align-items:center;gap:8px;padding:4px 12px 4px 4px;border-radius:999px;background:rgba(255,255,255,.88);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);box-shadow:0 8px 22px -14px rgba(30,34,48,.4),0 0 0 1px var(--rule);font-weight:600;font-size:13.5px;border:0;cursor:pointer;color:var(--ink);transition:transform .45s var(--ease),opacity .45s var(--ease)}
.brand i{display:grid;place-items:center;width:30px;height:30px;border-radius:50%;background:var(--rainbow);color:#fff;font-style:normal;font-size:13px;font-family:var(--jp);font-weight:700}
.ptsbar{position:fixed;z-index:50;top:calc(12px + env(safe-area-inset-top,0px));right:12px;display:flex;gap:2px;padding:4px;border-radius:999px;
  background:rgba(255,255,255,.88);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  box-shadow:0 8px 22px -14px rgba(30,34,48,.4),0 0 0 1px var(--rule);transition:transform .45s var(--ease),opacity .45s var(--ease)}
.ptsbar.hide,.brand.hide{transform:translateY(-90px);opacity:0}
.pt{display:inline-flex;align-items:center;gap:3px;border-radius:999px;padding:6px 8px;font-size:13.5px;font-weight:600;border:0;cursor:pointer;white-space:nowrap;background:transparent}
.pt svg{width:16px;height:16px}
.pt.fire{color:#C2560A}.pt.xp{color:#946400}.pt.ins{color:#5A3DB8}
.pt.bump{animation:bump .6s var(--ease)}
@keyframes bump{0%{transform:scale(1)}40%{transform:scale(1.25)}100%{transform:scale(1)}}

/* ===== Thanh điều hướng dưới: 4 nút đều nhau ===== */
.nav{position:fixed;z-index:50;left:50%;bottom:calc(12px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);display:flex;gap:4px;padding:6px;border-radius:24px;
  background:rgba(255,255,255,.92);backdrop-filter:blur(16px) saturate(1.3);-webkit-backdrop-filter:blur(16px) saturate(1.3);
  box-shadow:0 12px 30px -16px rgba(30,34,48,.45),0 0 0 1px var(--rule);transition:transform .45s var(--ease),opacity .45s var(--ease);width:min(380px,calc(100vw - 20px))}
.nav.hide{transform:translate(-50%,110px);opacity:0}
.nav button{position:relative;flex:1;height:54px;border-radius:18px;border:0;background:transparent;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;color:#9297A3;cursor:pointer;padding:0;font-size:11.5px;font-weight:500}
.nav button svg{width:23px;height:23px}
.nav button.on{color:var(--c-d);background:var(--c-t)}
.nav button:active{transform:scale(.95)}
.nav .dot{position:absolute;top:7px;right:calc(50% - 16px);width:8px;height:8px;border-radius:50%;background:var(--fire);box-shadow:0 0 0 2px #fff}
/* ===== Nút ===== */
.btn{position:relative;overflow:hidden;display:inline-flex;align-items:center;justify-content:center;gap:8px;font-weight:600;font-size:16px;line-height:1.25;
  background:var(--c-d);color:#fff;border:0;border-radius:14px;padding:13px 20px;cursor:pointer;text-decoration:none;text-align:center;
  box-shadow:0 4px 0 var(--c-dd),0 8px 18px -12px rgba(29,95,209,.8);transition:transform .18s var(--ease),box-shadow .18s var(--ease)}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--c-dd)}
.btn:disabled{background:#C5CCDA;box-shadow:0 3px 0 #B0B8C9;cursor:not-allowed;transform:none}
.btn--soft{background:var(--c-t);color:var(--c-d);box-shadow:0 3px 0 var(--c-t2)}
.btn--soft:active{box-shadow:0 1px 0 var(--c-t2)}
.btn--gold{background:var(--y);color:#3B2A00;box-shadow:0 3px 0 var(--y-d),0 8px 18px -12px rgba(201,138,18,.9)}
.btn--gold:active{box-shadow:0 1px 0 var(--y-d)}
.btn--ghost{background:transparent;color:var(--c-d);box-shadow:none;padding:10px 12px}
.btn--wide{width:100%}
.btn--sm{font-size:14px;padding:9px 14px;border-radius:12px}
.btn svg{width:18px;height:18px;flex:none}
.invite::after{content:"";position:absolute;top:0;bottom:0;left:-60%;width:40%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.45),transparent);transform:skewX(-18deg);animation:sheen 5.5s var(--ease) 1.2s infinite}
@keyframes sheen{0%,72%{left:-60%}100%{left:130%}}
.row{display:flex;gap:10px;align-items:center}
.row--wrap{flex-wrap:wrap}
.stack>*+*{margin-top:10px}

/* ===== Thẻ, chip, ô nhập ===== */
.card{background:#fff;border-radius:22px;border:1px solid var(--rule);box-shadow:var(--sh);padding:16px}
.chip{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:3px 10px;font-size:12px;font-weight:600;white-space:nowrap}
.chip--ok{background:var(--ok-t);color:#0E7A52}.chip--go{background:var(--c-t);color:var(--c-d)}.chip--y{background:var(--y-t);color:#7A5600}
.chp{display:inline-flex;align-items:center;border:1.5px solid var(--rule);background:#fff;border-radius:14px;padding:8px 12px;font-size:14.5px;cursor:pointer;text-align:left;line-height:1.35;margin:0 6px 8px 0;white-space:normal;box-shadow:0 2px 0 #E6ECF5;transition:background .2s,border-color .2s}
.chp.on{border-color:var(--c);background:var(--c-t);color:var(--c-d);box-shadow:0 2px 0 var(--c-t2)}
.chp:active{transform:translateY(1px)}
.chp--add{border-style:dashed;color:var(--c-d)}
.inp,textarea.inp,select.inp{width:100%;font:inherit;font-size:16px;color:var(--ink);background:#fff;border:1.5px solid var(--rule);border-radius:14px;padding:12px 14px}
textarea.inp{min-height:76px;resize:vertical;line-height:1.45}
.inp:focus{border-color:var(--c);outline:0;box-shadow:0 0 0 3px var(--c-t)}
.lbl{display:block;font-size:13.5px;color:var(--ink-2);margin:0 0 6px;font-weight:600}
.hl{animation:hl 2.4s var(--ease)}
@keyframes hl{0%,60%{box-shadow:0 0 0 3px var(--y)}100%{box-shadow:0 0 0 0 transparent}}
.sec{margin:22px 0 10px;display:flex;align-items:center;gap:8px}
.sec h2{font-size:19px}
.sec .more{margin-left:auto}

/* ===== Biểu tượng tròn ===== */
.hi{--hc:var(--c);--hd:var(--c-d);width:46px;height:46px;flex:none;border-radius:50%;background:var(--hc);display:grid;place-items:center;box-shadow:0 3px 0 var(--hd);position:relative}
.hi svg{width:52%;height:52%}
.hi--lg{width:84px;height:84px;box-shadow:0 4px 0 var(--hd)}
.hi--sm{width:36px;height:36px;box-shadow:0 2px 0 var(--hd)}
.stars{display:inline-flex;gap:1px;vertical-align:middle}

/* ===== Lời nhân vật ===== */
.say{display:flex;gap:10px;align-items:flex-end;margin:10px 0}
.say__av{width:52px;flex:none}
.say__b{background:#fff;border:1px solid var(--rule);border-radius:20px 20px 20px 6px;padding:10px 14px;font-size:15px;line-height:1.45;box-shadow:0 8px 20px -18px rgba(23,32,54,.6)}
.say--senpai .say__b{background:var(--y-t);border-color:#F3DFA9}
.say--virus .say__b{background:#F4F1FB;border-color:#E2DCF3}

/* ===== Màu nhóm (theo màu tuyến CD49) ===== */
.g1{--hc:#2A74DB;--hd:#1D5FD1;--ht:#E5EFFC}.g2{--hc:#22A05E;--hd:#17804A;--ht:#E3F5EA}.g3{--hc:#0F9F98;--hd:#0B7F79;--ht:#DFF4F2}.g4{--hc:#E0567F;--hd:#BE3D65;--ht:#FCE8EF}

/* ===== Hôm nay ===== */
.hello{display:flex;align-items:center;gap:12px;margin:6px 0 2px}
.hello h1{font-size:27px}
.hello .date{color:var(--muted);font-size:13.5px}
.hello .shin{width:58px;margin-left:auto;flex:none}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;background:#fff;border:1px solid var(--rule);border-radius:20px;padding:10px 8px;margin:10px 0 4px;box-shadow:var(--sh)}
.week div{text-align:center;font-size:11px;color:var(--muted);font-weight:500}
.week b{display:grid;place-items:center;width:34px;height:34px;margin:4px auto 0;border-radius:50%;font-size:14px;font-weight:600;color:var(--ink-2);background:#F4F1EA}
.week .wci b{background:var(--c-t);color:var(--c-d)}
.week .td b{background:var(--ink);color:#fff}
.week .td.wci b{background:var(--c-d)}
.week i{display:block;width:5px;height:5px;border-radius:50%;margin:4px auto 0;background:transparent}
.week .wci i{background:var(--ok)}
.sec{margin:20px 0 8px;display:flex;align-items:center;gap:8px}
.sec h2{font-size:18px}
.sec .more{margin-left:auto}
.carousel{display:flex;gap:12px;overflow-x:auto;-webkit-overflow-scrolling:touch;scroll-snap-type:x mandatory;padding:6px 18px 12px;margin:0 -18px;scrollbar-width:none}
.carousel::-webkit-scrollbar{display:none}
.hc{flex:none;width:min(84%,320px);scroll-snap-align:center;background:var(--tkp);border:1.5px solid var(--tkb);border-radius:20px;box-shadow:var(--sh);overflow:hidden;position:relative;display:flex;flex-direction:column}
.hc::before{content:"";height:6px;background:var(--rainbow);flex:none}
.hc__open{border:0;background:none;padding:14px 16px 8px;text-align:left;font:inherit;color:inherit;cursor:pointer;display:block;width:100%}
.hc__id{display:flex;align-items:center;gap:10px}
.hc__id .hi{width:44px;height:44px}
.hc__id b{display:block;font-size:16.5px;font-weight:600;line-height:1.25}
.hc__khi{display:block;margin-top:10px;font-size:14px;color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hc__khi em{font-style:normal;font-size:11px;letter-spacing:.06em;color:var(--muted);margin-right:6px}
.hc .wdots{margin:10px 0 0}
.evrow{display:flex;gap:6px;overflow-x:auto;-webkit-overflow-scrolling:touch;margin:0;padding:0 16px 10px;scrollbar-width:none}
.evrow::-webkit-scrollbar{display:none}
.evrow .chp{flex:none;margin:0;padding:5px 10px;font-size:12.5px;border-radius:11px;white-space:nowrap}
.cdots{display:flex;justify-content:center;gap:6px;margin:2px 0 0}
.cdots i{width:7px;height:7px;border-radius:50%;background:#DCD6C8;transition:all .3s var(--ease)}
.cdots i.on{width:20px;border-radius:4px;background:var(--c-d)}
.keeprow{display:flex;gap:8px;flex-wrap:wrap}
.keep{display:flex;align-items:center;gap:8px;background:#fff;border:1px solid var(--rule);border-radius:999px;padding:4px 6px 4px 4px;box-shadow:var(--sh)}
.keep .hi{width:30px;height:30px;box-shadow:none}
.keep b{font-size:13.5px;font-weight:500}
.keep .hold,.keep .hold.is svg.hk{width:36px;height:36px;font-size:11px}
.keep .hold svg.hr{display:none}


/* ===== Khối check-in tối ===== */
.ci{display:flex;gap:14px;align-items:center;border-radius:24px;padding:16px;margin:18px 0 6px;background:linear-gradient(135deg,#2A74DB,#1D5FD1 55%,#163E8C);color:#fff;box-shadow:0 4px 0 #12306E,0 16px 30px -18px rgba(29,95,209,.9);border:0;width:100%;text-align:left;cursor:pointer}
.ci .moon{width:46px;height:46px;flex:none;display:grid;place-items:center;background:rgba(255,255,255,.18);border-radius:50%}
.ci .moon svg{width:24px;height:24px}
.ci h3{font-size:18px;color:#fff}.ci p{margin:2px 0 0;font-size:14px;opacity:.9}
.ci .go{margin-left:auto;flex:none;background:var(--y);color:#3B2A00;border-radius:14px;padding:9px 14px;font-weight:600;font-size:14px;box-shadow:0 3px 0 var(--y-d)}
.ci--done{background:var(--ok-t);color:#0E6E4B;box-shadow:none;border:1px solid #A9E2CB}
.ci--done h3{color:#0E6E4B}.ci--done .moon{background:#fff;color:var(--ok)}
.empty{text-align:center;padding:22px 14px}
.banner{background:var(--y-t);border:1px solid #F3DFA9;border-radius:18px;padding:10px 12px;font-size:14px;margin:10px 0;display:flex;gap:10px;align-items:center}

/* ===== Cuống vé (stub) dùng chung ===== */
.stub{position:relative;display:flex;align-items:center;gap:12px;border-top:2px dashed #CFC6B2;background:var(--stub);padding:12px 16px;margin-top:auto}
.stub::before,.stub::after{content:"";position:absolute;top:-12px;width:22px;height:22px;border-radius:50%;background:var(--bg);border:1.5px solid var(--tkb)}
.stub::before{left:-12px}.stub::after{right:-12px}
.stub__n{font-size:24px;font-weight:600;color:var(--c-d);line-height:1}
.stub__n small{font-size:12px;color:var(--muted);font-weight:500}
.stub__k{font-size:11px;color:var(--muted);letter-spacing:.04em;margin-top:2px}
.meter{height:8px;border-radius:999px;background:#EFECE4;overflow:hidden;margin-top:6px}
.meter i{display:block;height:100%;border-radius:999px;background:linear-gradient(90deg,#F07F1E,#E0567F,#7A55D3,#2A74DB)}
.bar{width:64px;height:34px;flex:none;background:repeating-linear-gradient(90deg,#1E2230 0 2px,transparent 2px 4px,#1E2230 4px 5px,transparent 5px 8px,#1E2230 8px 11px,transparent 11px 13px);opacity:.7}
.hold{position:relative;width:60px;height:60px;flex:none;border-radius:50%;border:0;background:var(--y);color:#3B2A00;font-weight:600;font-size:13.5px;cursor:pointer;display:grid;place-items:center;box-shadow:0 4px 0 var(--y-d);touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;transition:transform .2s var(--ease);margin-left:auto}
.hold svg.hr{position:absolute;inset:-5px;width:70px;height:70px;transform:rotate(-90deg);pointer-events:none}
.hold svg.hr circle{fill:none;stroke:var(--c-d);stroke-width:4;stroke-linecap:round;stroke-dasharray:207;stroke-dashoffset:207;transition:stroke-dashoffset .1s linear}
.hold.holding{transform:scale(.93)}
.hold.holding svg.hr circle{stroke-dashoffset:0;transition:stroke-dashoffset .7s linear}
.hold.is{background:none;box-shadow:none}
.hold.is svg.hk{width:60px;height:60px}

/* ===== Chấm tần suất trong tuần ===== */
.wdots{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.wdots span{text-align:center;font-size:10px;color:var(--muted);font-weight:500;line-height:1.2}
.wdots span i{display:block;width:20px;height:20px;margin:0 auto 2px;border-radius:50%;border:1.5px dashed #CFC6B2;background:#fff}
.wdots span i.y{border:0;background:var(--c-d);box-shadow:inset 0 0 0 3px #fff,0 0 0 1.5px var(--c-d)}
.wdots span i.p{border:0;background:linear-gradient(90deg,var(--c-d) 50%,#fff 50%);box-shadow:0 0 0 1.5px var(--c-d)}
.wdots span i.x{border-style:solid;border-color:#E6E1D6}
.wdots span.td{color:var(--ink);font-weight:600}
.wdots span.td i{border-color:var(--c-d);border-style:solid}

/* ===== Bộ thẻ: thẻ nhỏ kiểu vé ===== */
.deck{margin:16px 0 4px}
.deck__h{display:flex;align-items:center;gap:10px;margin:0 0 6px}
.deck__h .hi{width:30px;height:30px;box-shadow:none}
.deck__h h2{font-size:16.5px}
.strip{display:flex;gap:10px;overflow-x:auto;-webkit-overflow-scrolling:touch;scroll-snap-type:x mandatory;padding:6px 18px 12px;margin:0 -18px;scrollbar-width:none}
.strip::-webkit-scrollbar{display:none}
.mc{scroll-snap-align:start;flex:none;width:108px;height:150px;border-radius:14px;border:1.5px solid var(--tkb);cursor:pointer;padding:0;display:flex;flex-direction:column;align-items:center;text-align:center;font:inherit;color:inherit;
  background:var(--tkp);box-shadow:0 8px 18px -14px rgba(30,34,48,.6);position:relative;overflow:hidden;transition:transform .2s var(--ease)}
.mc::before{content:"";display:block;width:100%;height:5px;background:var(--hc);flex:none}
.mc:active{transform:scale(.97)}
.mc .hi{width:50px;height:50px;margin-top:14px}
.mc b{font-size:13px;font-weight:600;line-height:1.25;margin-top:8px;padding:0 6px}
.mc .stars{margin:auto 0 0;padding:6px 0;width:100%;border-top:1.5px dashed #DCD3BF;justify-content:center;background:var(--stub)}
.mc.off{opacity:.78}
.mc.off .hi{filter:saturate(.55)}
.mc .tag{position:absolute;top:10px;right:8px;width:9px;height:9px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 2px #fff}
.mc.lv2{border-color:var(--l2)}.mc.lv3{border-color:var(--l3);box-shadow:0 0 0 2px rgba(227,169,22,.25),0 8px 18px -14px rgba(30,34,48,.6)}

/* ===== Thẻ lớn: mặt trước kiểu vé, mặt sau kiểu bưu thiếp ===== */
.flip{perspective:1600px;width:min(354px,100%);margin:4px auto 0;cursor:pointer}
.flip__in{position:relative;height:476px;transition:transform .7s var(--ease);transform-style:preserve-3d;-webkit-transform-style:preserve-3d}
.flip.flipped .flip__in{transform:rotateY(180deg)}
.tkf,.tkb{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:22px;overflow:hidden;display:flex;flex-direction:column}
.tkf{background:var(--tkp);border:1.5px solid var(--tkb);box-shadow:var(--sh)}
.tkf::before{content:"";height:7px;background:var(--rainbow);flex:none}
.tkf.lv2{border-color:var(--l2)}.tkf.lv3{border-color:var(--l3)}
.tk__top{display:flex;align-items:center;gap:8px;padding:10px 14px 8px;border-bottom:1.5px solid var(--tkl)}
.tk__top b{font-size:12px;letter-spacing:.08em;color:var(--c-d);font-weight:600}
.tk__top .jp{font-size:11.5px;color:var(--muted)}
.tk__icons{margin-left:auto;display:flex;gap:6px}
.tk__icons button{width:32px;height:32px;border-radius:50%;border:1.5px solid var(--tkl);background:#fff;display:grid;place-items:center;cursor:pointer;color:var(--ink-2);padding:0}
.tk__icons button svg{width:16px;height:16px}
.tk__icons .run{color:var(--ok);border-color:#BFE3CD;background:var(--ok-t)}
.tk__icons .paused{color:var(--muted);background:#F1EEE7}
.tk__body{padding:12px 16px 10px;display:flex;flex-direction:column;gap:10px;flex:1;min-height:0}
.tk__id{display:flex;align-items:center;gap:12px}
.tk__id .hi{width:52px;height:52px}
.tk__id b{display:block;font-size:18px;font-weight:600;line-height:1.2;letter-spacing:-.01em}
.rank{display:inline-flex;align-items:center;gap:6px;margin-top:3px;font-size:12px;font-weight:500;color:var(--ink-2)}
.rank i{font-style:normal;padding:1px 8px;border-radius:6px;color:#fff;font-size:11px;font-weight:600;background:var(--l1)}
.rank.lv2 i{background:var(--l2)}.rank.lv3 i{background:var(--l3);color:#3B2A00}.rank.lv0 i{background:#B9B3A6}
.route{display:grid;grid-template-columns:minmax(0,1fr) 34px minmax(0,1fr);align-items:center;gap:6px;border:1.5px solid var(--tkl);border-radius:14px;padding:10px 12px;background:#fff}
.route small{display:block;font-size:10.5px;letter-spacing:.08em;color:var(--muted);font-weight:600}
.route b{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;font-size:14px;font-weight:600;line-height:1.35}
.route .to{text-align:right}
.route svg{width:34px;height:14px}
.route--1{grid-template-columns:1fr}
.whoq{font-style:italic;color:var(--c-d);font-size:14.5px;line-height:1.4;border-left:4px solid #E0567F;background:#FDF5F8;border-radius:0 12px 12px 0;padding:6px 10px}
.whoq small{display:block;font-style:normal;font-size:10.5px;letter-spacing:.08em;color:var(--muted);font-weight:600}
.howlink{display:inline-flex;align-items:center;gap:6px;font-weight:600;color:var(--c-d);text-decoration:underline;text-underline-offset:4px;font-size:14.5px;border:0;background:none;padding:2px 0;cursor:pointer;align-self:flex-start}
.howlink svg{width:18px;height:18px}
.tkb{transform:rotateY(180deg);color:#fff;padding:0 0 14px;
  background-color:#1D4FB8;
  background-image:radial-gradient(circle at 50% 100%,transparent 37%,rgba(255,255,255,.07) 38% 41%,transparent 42% 54%,rgba(255,255,255,.07) 55% 58%,transparent 59%),linear-gradient(160deg,#2A74DB,#163E8C);
  background-size:34px 17px,100% 100%;box-shadow:var(--sh)}
.tkb.lv3{box-shadow:0 0 0 2px var(--l3),var(--sh)}
.tkb__top{display:flex;align-items:center;justify-content:space-between;padding:12px 16px 4px;font-size:12px;letter-spacing:.08em;font-weight:600;color:rgba(255,255,255,.8)}
.tkb__art{display:grid;place-items:center;height:132px;margin:2px 0 6px}
.tkb__art svg{height:132px;width:auto;max-width:92%}
.tkb__prov{display:flex;align-items:center;gap:10px;margin:0 14px;background:#FFF6E0;color:var(--ink);border-radius:14px;padding:9px 12px}
.tkb__prov .jp{font-size:17px;line-height:1.3;color:#4A3F25;font-weight:500}
.tkb__prov small{display:block;font-size:11.5px;color:#8A7A55}
.tkb__prov .vi{font-size:13.5px;color:#5C5136}
.tkb__gain{margin:10px 16px 0;font-size:14.5px;line-height:1.45}
.tkb__gain small,.tkb__sp small{display:block;font-size:10.5px;letter-spacing:.08em;color:#FFD772;font-weight:600}
.tkb__sp{display:flex;gap:10px;align-items:flex-start;margin:10px 14px 0;background:rgba(255,255,255,.1);border-radius:14px;padding:8px 10px}
.tkb__sp .av{width:40px;height:40px;flex:none;border-radius:50%;background:#fff;overflow:hidden}
.tkb__sp .av svg{width:46px;height:46px;margin:-1px 0 0 -3px}
.tkb__sp p{margin:0;font-size:13px;line-height:1.45;color:rgba(255,255,255,.92);display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
.tkb .spk{background:#fff;color:var(--c-d);box-shadow:0 2px 0 #E8DDBF}
.master .tkf{box-shadow:0 0 0 3px var(--l3),0 0 0 7px rgba(227,169,22,.22),var(--sh)}
.master .tkf::after{content:"";position:absolute;inset:0;background:linear-gradient(115deg,transparent 30%,rgba(255,255,255,.6) 45%,transparent 60%);transform:translateX(-100%);animation:holo 4s var(--ease) infinite;pointer-events:none}
@keyframes holo{0%,60%{transform:translateX(-100%)}100%{transform:translateX(100%)}}
.fliphint{text-align:center;font-size:12.5px;color:var(--muted);margin:10px 0 0}
.cardact{display:flex;gap:8px;justify-content:center;max-width:354px;margin:12px auto 0}
.cardact .btn{flex:1}

/* ===== Trang Cách làm: nền khác để biết đang ở trang hướng dẫn ===== */
.sheet.howpg{background:#EEF4F1}
.sheet.howpg .sh__h{background:#EEF4F1}
.howhero{display:flex;align-items:center;gap:12px;border-radius:22px;padding:14px;color:#fff;background:linear-gradient(135deg,var(--hc),var(--hd));margin:0 0 12px;position:relative;overflow:hidden}
.howhero::after{content:"";position:absolute;right:-50px;top:-50px;width:160px;height:160px;border-radius:50%;background:rgba(255,255,255,.14)}
.howhero .hi{background:#fff;box-shadow:none}
.howhero small{display:block;font-size:12px;opacity:.9;letter-spacing:.06em}
.howhero b{font-size:19px;font-weight:600}
.hsec{background:#fff;border-radius:20px;padding:12px 14px;margin:0 0 12px;box-shadow:0 8px 20px -18px rgba(30,34,48,.6)}
.hsec__h{display:flex;align-items:center;gap:8px;margin:0 0 8px;font-weight:600;font-size:15px}
.hsec__h i{font-style:normal;display:grid;place-items:center;width:26px;height:26px;border-radius:8px;background:var(--c-t);color:var(--c-d);font-size:13px;font-weight:700}
.hsec .ill{box-shadow:none;border:0;padding:0;margin:0}
.hsec .steps li{background:#FAF8F3;border-color:#EFEAE0}

/* ===== Công thức 3 ô (kiểu điền từng ô) ===== */
.sentence{font-family:var(--h);font-size:22px;line-height:1.45;font-weight:600;margin:6px 0 14px;color:#9AA4B8}
.sentence u{text-decoration:none;color:var(--ink);border-bottom:3px solid #E0E6F0;padding-bottom:1px}
.sentence u.cur{border-bottom-color:var(--y);color:var(--c-d)}
.sentence u.fill{border-bottom-color:var(--c)}
.qlab{font-size:14px;font-weight:600;color:var(--ink-2);margin:0 0 8px}

/* ===== Lớp phủ ===== */
.ov{position:fixed;inset:0;z-index:80;background:rgba(18,26,48,.45);backdrop-filter:blur(2px);-webkit-backdrop-filter:blur(2px);display:flex;align-items:flex-end;justify-content:center;animation:fade .3s var(--ease)}
@keyframes fade{from{opacity:0}to{opacity:1}}
.sheet{background:var(--bg);width:100%;max-width:760px;height:100%;overflow:auto;-webkit-overflow-scrolling:touch;padding:calc(12px + env(safe-area-inset-top,0px)) 18px calc(24px + env(safe-area-inset-bottom,0px));animation:sheetIn .5s var(--ease);position:relative}
@keyframes sheetIn{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}
@media (min-width:760px){.ov{align-items:center;padding:24px}.sheet{height:auto;max-height:calc(100vh - 48px);border-radius:28px;padding:20px 26px 26px}}
.sheet--mini{height:auto;max-height:88%;border-radius:28px 28px 0 0}
@media (min-width:760px){.sheet--mini{max-width:520px;border-radius:28px}}
.sh__h{display:flex;align-items:center;gap:8px;position:sticky;top:calc(-12px - env(safe-area-inset-top,0px));z-index:3;background:var(--bg);padding:6px 0 10px;margin:0 0 4px}
.x,.back{width:40px;height:40px;border-radius:50%;border:0;background:#E7ECF4;cursor:pointer;display:grid;place-items:center;flex:none;color:var(--ink)}
.x{margin-left:auto}.x svg,.back svg{width:18px;height:18px}
.prog{display:flex;gap:5px;flex:1;max-width:220px}
.prog i{flex:1;height:6px;border-radius:9px;background:#DCE3EE}
.prog i.on{background:var(--y)}.prog i.done{background:var(--c)}
.sbar{position:sticky;bottom:calc(-24px - env(safe-area-inset-bottom,0px));display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:16px;padding:10px 10px 10px 16px;background:#fff;border:1px solid var(--rule);border-radius:20px;box-shadow:0 -10px 24px -20px rgba(23,32,54,.5);z-index:2}
.sbar .st{font-size:13.5px;color:var(--muted);border:0;background:none;padding:6px 0;cursor:pointer;text-align:left;flex:1;font-weight:600}
.sbar .st.miss{color:#B5402F;text-decoration:underline dotted 2px;text-underline-offset:4px}
.sbar .st.okk{color:#0E7A52}
.sbar .btn{flex:none;min-width:130px}
.lc{animation:slidein .5s var(--ease)}
@keyframes slidein{from{opacity:0;transform:translateX(24px)}to{opacity:1;transform:none}}
.ey{font-size:13px;font-weight:600;color:var(--c-d);margin:4px 0 4px}
.lc h2{font-size:22px;margin-bottom:10px}

/* ===== Cách làm chi tiết ===== */
.jpbox{display:flex;gap:10px;align-items:center;background:#fff;border:1px solid var(--rule);border-radius:18px;padding:10px 12px;margin:10px 0}
.jpbox .jp{font-size:19px;color:var(--c-d);line-height:1.3}
.jpbox small{display:block;color:var(--muted);font-size:12.5px}
.jpbox .vi{font-size:14px;color:var(--ink-2)}
.spk{width:42px;height:42px;border-radius:50%;border:0;background:var(--c-t);color:var(--c-d);display:grid;place-items:center;cursor:pointer;flex:none;margin-left:auto;box-shadow:0 2px 0 var(--c-t2)}
.spk svg{width:20px;height:20px}
.steps{margin:8px 0;padding:0;list-style:none;counter-reset:s}
.steps li{position:relative;padding:9px 12px 9px 46px;background:#fff;border:1px solid var(--rule);border-radius:16px;margin:0 0 7px;font-size:14.5px;line-height:1.4}
.steps li::before{counter-increment:s;content:counter(s);position:absolute;left:11px;top:9px;width:25px;height:25px;border-radius:50%;background:var(--c);color:#fff;font-weight:700;font-size:13.5px;display:grid;place-items:center;box-shadow:0 2px 0 var(--c-d)}
.steps li b{display:block;font-size:15px}
.ill{background:#fff;border:1px solid var(--rule);border-radius:20px;padding:10px;margin:8px 0;box-shadow:var(--sh)}
.ill svg{display:block;width:100%;max-width:460px;margin:0 auto;height:auto}
.ill figcaption{font-size:12.5px;color:var(--muted);text-align:center;margin-top:4px}
.dd{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin:10px 0}
.dd p{margin:0;border-radius:14px;padding:8px 10px;font-size:14px;line-height:1.35}
.dd .yes{background:var(--ok-t);color:#0B5E40}.dd .no{background:var(--no-t);color:#8E2F22}
.dd .hd{font-size:12.5px;font-weight:700;padding:0 4px;background:none}
details.oops{background:var(--y-t);border:1px solid #F3DFA9;border-radius:18px;padding:10px 14px;margin:10px 0}
details.oops summary{font-weight:600;color:#7A5600;cursor:pointer;font-size:14.5px}
details.oops ul{margin:8px 0 2px;padding-left:18px}details.oops li{font-size:14.5px;margin-bottom:4px}
.q{background:#fff;border:1px solid var(--rule);border-radius:22px;padding:14px;margin:10px 0;box-shadow:var(--sh)}
.q p.sc{font-size:15.5px;font-weight:600}
.opt{display:grid;grid-template-columns:30px 1fr;gap:10px;align-items:start;width:100%;text-align:left;background:#fff;border:1.5px solid var(--rule);border-radius:18px;padding:11px 12px;margin:8px 0;font:inherit;font-size:15px;line-height:1.4;cursor:pointer;box-shadow:0 3px 0 #E6ECF5}
.opt i{font-style:normal;width:28px;height:28px;border-radius:50%;background:var(--c-t);color:var(--c-d);font-weight:700;display:grid;place-items:center;font-size:14px}
.opt.good{border-color:#8ED9BC;background:var(--ok-t)}.opt.good i{background:var(--ok);color:#fff}
.opt.bad{border-color:#F3B2A7;background:var(--no-t)}.opt.bad i{background:var(--no);color:#fff}
.opt:disabled{cursor:default;color:inherit}
.out{border-radius:18px;padding:11px 14px;margin:8px 0;font-size:14.5px}
.out--good{background:var(--ok-t);border:1px solid #A9E2CB;color:#0B5E40}.out--bad{background:var(--no-t);border:1px solid #F6C3B9;color:#8E2F22}
.out b{display:block}
.quote{border-left:4px solid var(--y);padding:4px 0 4px 12px;margin:10px 0;font-size:15px;color:var(--ink-2);font-style:italic}
.quote small{display:block;color:var(--muted);font-size:12.5px;font-style:normal;margin-top:2px}
.note{font-size:12.5px;color:var(--muted)}

/* ===== Check-in ===== */
.big3{display:grid;gap:8px;margin:10px 0}
.big3 button{display:flex;align-items:center;gap:12px;border:2px solid var(--rule);background:#fff;border-radius:18px;padding:11px 14px;font:inherit;font-size:16px;font-weight:600;cursor:pointer;text-align:left;box-shadow:0 3px 0 #E6ECF5}
.big3 button svg{width:34px;height:34px;flex:none}
.big3 button.on.y{border-color:var(--ok);background:var(--ok-t)}
.big3 button.on.p{border-color:var(--y);background:var(--y-t)}
.big3 button.on.n{border-color:var(--no);background:var(--no-t)}
.big3 button.on.x{border-color:var(--c-t2);background:var(--c-t)}
.big3 small{display:block;font-weight:400;font-size:12.5px;color:var(--muted)}
.mini-h{display:flex;gap:10px;align-items:center;background:#fff;border:1px solid var(--rule);border-radius:18px;padding:10px 12px;margin:6px 0}
.mini-h b{display:block;font-size:15.5px;line-height:1.25}
.sum{text-align:center}
.sum .big{font-family:var(--h);font-weight:800;font-size:44px;color:var(--fire);line-height:1}
.prov{background:var(--paper);border:1px solid var(--paper-d);border-radius:20px;padding:12px 14px;margin:12px 0;text-align:left;display:flex;gap:10px;align-items:center}
.prov .jp{font-size:20px;color:#4A3F25;line-height:1.35}
.prov small{display:block;color:#8A7A55}
.prov .vi{font-size:14.5px;color:#5C5136;margin-top:2px}

/* ===== Tiến bộ, Thẻ tuần ===== */
.rc{background:var(--paper);border:1px solid var(--paper-d);border-radius:22px;padding:14px;margin-top:14px}
.rc__h{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.rc__h h3{font-size:16px;color:#3E3420}
.rc table{width:100%;border-collapse:separate;border-spacing:3px 4px;table-layout:fixed}
.rc th{font-size:11.5px;color:#8A7A55;font-weight:600}
.rc th.hn{text-align:left;width:30%}
.rc td{padding:0}
.rc td.hn{font-size:12.5px;font-weight:600;color:#4A3F25;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cell{aspect-ratio:1;border-radius:50%;border:1.5px dashed #D9CBA7;display:grid;place-items:center;background:rgba(255,255,255,.55)}
.cell svg{width:100%;height:100%}
.cell.today{border-color:var(--c);border-style:solid}
.plist{background:#fff;border:1px solid var(--rule);border-radius:22px;box-shadow:var(--sh);overflow:hidden}
.prow{display:flex;gap:12px;align-items:center;padding:12px 14px;border-top:1px solid var(--rule);width:100%;border-left:0;border-right:0;border-bottom:0;background:none;font:inherit;color:inherit;text-align:left;cursor:pointer}
.prow:first-child{border-top:0}
.prow .hi{width:38px;height:38px}
.prow .tt{flex:1;min-width:0}
.prow .tt b{display:block;font-size:15px;font-weight:600}
.prow .b{height:6px;background:#EEF2F8;border-radius:6px;overflow:hidden;margin-top:6px}
.prow .b i{display:block;height:100%;background:var(--c);border-radius:6px}
.prow .ready{background:var(--y);color:#3B2A00;border-radius:999px;padding:3px 10px;font-size:12px;font-weight:600}
.wk{background:var(--paper);border:1px solid var(--paper-d);border-radius:24px;padding:16px}
.wk__h{display:flex;gap:10px;align-items:center;border-bottom:2px dashed var(--paper-d);padding-bottom:10px;margin-bottom:10px}
.wk__h h2{font-size:19px;color:#3E3420}
.wk__h small{display:block;color:#8A7A55;font-size:13px}
.wk__hb{margin:10px 0;padding:10px;background:rgba(255,255,255,.65);border-radius:16px}
.wk__hb h3{font-size:15px;color:#3E3420;margin-bottom:6px;display:flex;align-items:center;gap:8px}
.wk .days{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.wk .days div{text-align:center;font-size:11px;color:#8A7A55;font-weight:600}
.scale{display:flex;gap:4px;margin-top:8px}
.scale button{flex:1;border:1.5px solid #E2D6B6;background:#fff;border-radius:10px;padding:6px 2px;font:inherit;font-size:11.5px;font-weight:600;color:#6B5D3A;cursor:pointer;line-height:1.2}
.scale button.on{background:var(--c);border-color:var(--c);color:#fff}
.verif{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.verif>div{background:rgba(255,255,255,.65);border-radius:16px;padding:10px;text-align:center;font-size:13px;color:#6B5D3A;min-height:110px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px}
.verif svg{width:58px;height:58px}
.wk7{display:flex;gap:6px;align-items:flex-end;height:84px;margin:8px 0 4px;padding:0 4px}
.wk7 div{flex:1;text-align:center;font-size:11px;color:var(--muted);font-weight:600}
.wk7 i{display:block;margin:0 auto 4px;width:70%;border-radius:8px 8px 4px 4px;background:var(--c-t2)}
.wk7 i.on{background:var(--c)}

/* ===== Sổ tay ===== */
.tabs{display:flex;gap:6px;background:#E8EDF5;border-radius:14px;padding:4px;margin:10px 0 4px}
.tabs button{flex:1;border:0;background:transparent;border-radius:11px;padding:8px 6px;font-weight:600;font-size:14px;color:var(--ink-2);cursor:pointer}
.tabs button.on{background:#fff;color:var(--c-d);box-shadow:0 2px 6px -3px rgba(23,32,54,.35)}
.kpi{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:10px 0}
.kpi div{background:#fff;border:1px solid var(--rule);border-radius:18px;padding:10px 6px;text-align:center;box-shadow:var(--sh)}
.kpi b{display:block;font-family:var(--h);font-size:24px;font-weight:800;line-height:1.1}
.kpi span{font-size:12px;color:var(--muted)}
.kpi .k-f b{color:var(--fire)}.kpi .k-x b{color:var(--xp)}.kpi .k-i b{color:var(--ins)}.kpi .k-s b{color:var(--seal)}.kpi .k-o b{color:var(--ok)}.kpi .k-c b{color:var(--c)}
.setl{background:#fff;border:1px solid var(--rule);border-radius:22px;overflow:hidden;box-shadow:var(--sh);margin:10px 0}
.setr{border-top:1px solid var(--rule)}.setr:first-child{border-top:0}
.setr__h{box-sizing:border-box;display:flex;gap:12px;align-items:center;width:100%;border:0;background:none;padding:12px 14px;font:inherit;color:inherit;cursor:pointer;text-align:left}
.setr__h .hi{width:34px;height:34px;box-shadow:0 2px 0 var(--hd)}
.setr__h .hi svg{width:55%;height:55%}
.setr__h b{flex:1;font-size:15px;font-weight:600}
.setr__h span{font-size:13px;color:var(--muted);max-width:44%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.setr__b{padding:0 14px 14px 60px;font-size:14px;color:var(--ink-2)}
.setr__b p{margin:0 0 8px}
.tog{position:relative;width:52px;height:30px;border-radius:30px;background:#C9D0DE;border:0;cursor:pointer;flex:none;transition:background .2s}

.toast.show{opacity:1;transform:translate(-50%,0);pointer-events:auto}

.stampov div{width:170px;animation:stampBig 1.2s var(--ease) forwards}
@keyframes stampBig{0%{transform:scale(2.3) rotate(-14deg);opacity:0}35%{transform:scale(1) rotate(-8deg);opacity:1}75%{transform:scale(1) rotate(-8deg);opacity:1}100%{transform:scale(.9) rotate(-8deg);opacity:0}}

.blink{animation:blink 5s infinite;transform-origin:center;transform-box:fill-box}
@keyframes blink{0%,94%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
.bob{animation:bob 3.6s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
.wave{transform-origin:30% 90%;transform-box:fill-box;animation:wave 1.6s ease-in-out infinite}

.tail{transform-origin:10% 90%;transform-box:fill-box;animation:tail 2.4s ease-in-out infinite}

/* =====================================================================
   TQ08 · bỏ lướt dọc, cả trang cuộn · thanh trên 1 dòng · thanh dưới kính mờ

:root{--hd8:calc(56px + env(safe-area-inset-top,0px));--bar8:calc(74px + env(safe-area-inset-bottom,0px))}

.ahd{padding:calc(8px + env(safe-area-inset-top,0px)) 16px 8px}

.ahd__in{display:flex;align-items:center;gap:10px;max-width:460px;margin:0 auto}

.d7>span>span,.d7>button>span{width:auto!important;height:auto!important;border:0!important;background:none!important;box-shadow:none!important;border-radius:0;display:inline;color:inherit;aspect-ratio:auto}
.fx{background:var(--bg);border-radius:14px;padding:8px 12px;margin:6px 0;font-size:14.5px;line-height:1.45}
.fx span{display:block;font-size:11px;letter-spacing:.06em;font-weight:600;color:var(--muted);margin-bottom:2px}
@media (max-height:740px){ body.pg0 .pview{justify-content:flex-start} }

/* =====================================================================
   TQ10 · Cách làm dạng thẻ ngắn + thực tập · xem thẻ rộng hơn · công thức gọn
   ===================================================================== */
.sheet .flip,.cardview .flip{width:min(400px,100%)}
.cardview{padding:4px 0 0}
.howbtn{display:flex;align-items:center;gap:12px;width:min(400px,100%);margin:12px auto 0;border:1.5px solid var(--c-t2);background:#fff;border-radius:18px;padding:12px 14px;font:inherit;color:inherit;text-align:left;cursor:pointer;box-shadow:0 8px 20px -16px rgba(29,95,209,.6)}
.howbtn .hb__i{display:grid;place-items:center;width:40px;height:40px;border-radius:12px;background:var(--c-t);color:var(--c-d);flex:none}
.howbtn .hb__i svg{width:20px;height:20px}
.howbtn>span:nth-child(2){flex:1}
.howbtn b{display:block;font-size:15px;font-weight:600}
.howbtn small{font-size:12.5px;color:var(--muted)}
.howbtn>svg{width:18px;height:18px;color:var(--c-d)}
/* công thức: gạch chấm nhẹ, không rối */
.sentence u{border-bottom:2px dotted #CFC6B2}
.sentence u.fill{border-bottom:2px dotted var(--c)}
.sentence u.cur{border-bottom:2.5px solid var(--y)}
/* Cách làm: thẻ ngắn */
.hwc{background:#fff;border-radius:22px;padding:14px;box-shadow:0 10px 26px -20px rgba(30,34,48,.6);min-height:260px}
.hw__k{font-size:12px;letter-spacing:.08em;font-weight:700;color:var(--c-d);text-transform:uppercase;margin:0 0 10px}
.hw__why{background:var(--bg);border-radius:14px;padding:8px 12px;margin:8px 0;font-size:14.5px;line-height:1.5}
.hw__why small{display:block;font-size:10.5px;letter-spacing:.08em;color:var(--muted);font-weight:600}
.hwsteps{display:flex;flex-direction:column;gap:10px}
.hws{display:flex;gap:12px;align-items:flex-start;background:#FAF8F3;border-radius:16px;padding:12px}
.hws i{font-style:normal;flex:none;display:grid;place-items:center;width:34px;height:34px;border-radius:50%;background:var(--c-d);color:#fff;font-weight:700;font-size:15px}
.hws b{display:block;font-size:16px;font-weight:600}
.hws span{font-size:14px;color:var(--ink-2);line-height:1.45}
.sbar .btn--ghost{min-width:0}
.sbar--one{justify-content:center;padding:10px}
.sbar--one .btn{min-width:0}
/* thực tập */
.pr__q{font-size:15px;line-height:1.5;font-weight:500;margin:0 0 10px}
.pr__seq{display:grid;gap:6px;margin:0 0 10px}
.pr__seq span{display:flex;align-items:center;gap:10px;min-height:42px;border:1.5px dashed #D9CFBA;border-radius:14px;padding:6px 10px;font-weight:600;color:var(--ink)}
.pr__seq span i{font-style:normal;display:grid;place-items:center;width:24px;height:24px;border-radius:50%;background:#EEEAE0;color:var(--muted);font-size:12px;flex:none}
.pr__seq span.on{border-style:solid;border-color:#A9E2CB;background:var(--ok-t)}
.pr__seq span.on i{background:var(--ok);color:#fff}
.pr__pool{min-height:44px}
.pr__time{font-size:40px;font-weight:700;text-align:center;color:var(--c-d);letter-spacing:.02em}
.pr__rng{width:100%;accent-color:var(--c-d);height:30px}
.pr__tl{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);gap:4px}
.pr__sent{line-height:2.2;font-size:16px;margin:0 0 10px}
.tok{border:0;background:#F3EFE6;border-radius:8px;padding:3px 8px;font:inherit;cursor:pointer;margin:0 1px}
.tok.on{background:#FFE7A8;box-shadow:inset 0 -2px 0 var(--y)}
.pr__memo{background:#FFFBEA;border:1px solid #F0E2B3;border-radius:14px;padding:8px 12px;margin:0 0 10px;font-size:14.5px;background-image:repeating-linear-gradient(#FFFBEA 0 26px,#EFE3BE 26px 27px)}
.pr__memo small{display:block;font-size:10.5px;letter-spacing:.08em;color:#9A7B55;font-weight:700}
.pr__desk{position:relative;min-height:150px;border-radius:16px;background:#E9DCC4;padding:14px;display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:center}
.tdi{border:0;background:#fff;border-radius:12px;padding:10px 14px;font:inherit;font-weight:600;font-size:14px;box-shadow:0 4px 0 #CDBB97;cursor:pointer}
.tdi:active{transform:scale(.92)!important}
.pr__shelf{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:10px 0 0;padding:8px 10px;border-bottom:4px solid #B99A6A;background:#FAF6EE;border-radius:12px 12px 0 0}
.pr__shelf small{font-size:10.5px;font-weight:700;letter-spacing:.08em;color:#9A7B55;margin-right:4px}
.pr__shelf span{font-size:12.5px;background:var(--ok-t);color:#17804A;border-radius:8px;padding:2px 8px;font-weight:600}
.pr__shelf span.ph{width:44px;height:20px;background:none;border:1.5px dashed #D9CFBA}
.pr__clock{text-align:center;font-weight:700;color:var(--fire);margin-top:8px}
.brc{display:grid;place-items:center;margin:8px 0}
.brc button{position:relative;width:180px;height:180px;border-radius:50%;border:0;background:var(--c-t);cursor:pointer;touch-action:none;-webkit-user-select:none;user-select:none;transition:transform 3.8s ease-in-out}
.brc button.ex{transform:scale(.88)}
.brc button:not(.ex):active{transform:scale(1.08)}
.brc svg{position:absolute;inset:0;width:100%;height:100%;transform:rotate(-90deg)}
.brc .bg{fill:none;stroke:#DCE6F7;stroke-width:8}
.brc .fg{fill:none;stroke:var(--c-d);stroke-width:8;stroke-linecap:round}
.brc span{position:relative;font-weight:700;font-size:17px;color:var(--c-d)}
.howhero .hi{background:rgba(255,255,255,.22)!important;box-shadow:none!important}

/* =====================================================================
   TQ11 · cửa hàng thẻ · tổng quan nhiều tuần · đo tiến bộ thật · thẻ tuần tô màu
   ===================================================================== */
.hstreak{border:0;background:none;padding:0;cursor:pointer;font:inherit}
.dd2 button{width:12px;height:12px;border:0;padding:0;background:none;cursor:pointer;position:relative}

.wnav{display:flex;align-items:center;gap:10px;margin:2px 0 12px}
.wnav>div{flex:1;text-align:center}
.wnav b{display:block;font-size:18px;font-weight:600}
.wnav small{font-size:12.5px;color:var(--muted)}
.arr2:disabled{opacity:.3;cursor:default}
.shinrv{display:flex;gap:10px;align-items:center;background:#fff;border-radius:18px;padding:10px 12px;margin:0 0 12px;box-shadow:0 8px 20px -18px rgba(30,34,48,.6)}
.shinrv .av{width:52px;flex:none}
.shinrv p{margin:0;font-size:14px;line-height:1.5}
.kp3 button{position:relative}
.kp3 b.ok{color:var(--ok)}
.kp3 em{display:flex;align-items:center;justify-content:center;gap:3px;font-style:normal;font-size:10.5px;color:#6B7280;margin-top:2px}
.vit{display:inline-flex;align-items:center;gap:3px;font-size:11px;font-weight:600;border-radius:999px;padding:1px 8px;vertical-align:2px}
.krow.web{opacity:.85;background:repeating-linear-gradient(135deg,#fff 0 10px,#F6F6F8 10px 11px)}
.kdots i.p{border:0;background:#9DD6B6}
.mcal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin:4px 0 10px}
.mcal span{display:grid;place-items:center;aspect-ratio:1;border-radius:50%;font-size:13px;color:var(--ink-2);background:#fff}
.mcal span:empty{background:none}
.mcal span.h{background:none;font-size:11px;color:var(--muted);font-weight:600;aspect-ratio:auto}
.mcal span.on{background:var(--c-d);color:#fff;font-weight:600}
.mcal span.td{box-shadow:0 0 0 2px var(--y)}
.mcal span.fu{opacity:.4}
/* cửa hàng */
.sgrp{margin:18px 0 6px}
.sg__n{margin-left:auto;font-size:12.5px;font-weight:600;color:var(--muted)}
.sg__bar{height:4px;border-radius:4px;background:#ECE7DC;margin:0 0 8px;overflow:hidden}
.sg__bar i{display:block;height:100%;background:var(--c-d);border-radius:4px}
.slist{background:#fff;border-radius:18px;overflow:hidden;box-shadow:0 8px 20px -18px rgba(30,34,48,.6)}
.srow{display:flex;align-items:center;gap:12px;width:100%;border:0;border-top:1px solid var(--rule);background:none;padding:10px 12px;font:inherit;color:inherit;text-align:left;cursor:pointer}
.srow:first-child{border-top:0}
.srow .emb{box-shadow:none}
.sr__b{flex:1;min-width:0}
.sr__b b{display:block;font-size:15px;font-weight:600;line-height:1.3}
.sr__b small{font-size:12.5px;color:var(--muted)}
.srow>svg{width:16px;height:16px;color:#B9B3A6;flex:none}
.stag{flex:none;font-style:normal;font-size:11px;font-weight:700;border-radius:999px;padding:2px 8px;background:#EEF0F4;color:var(--muted)}
.stag.new{background:#FDE8EF;color:#BE3D65}.stag.on{background:var(--c-t);color:var(--c-d)}.stag.gold{background:#FFF1BF;color:#7A5600}.stag.keep{background:var(--ok-t);color:#17804A}
.mc .stag{position:absolute;top:8px;left:8px;font-size:10px;padding:1px 6px}
.mc--big{width:132px;height:170px}
.strip--big{gap:12px;scroll-snap-type:x mandatory}
.bigc{flex:none;width:280px;scroll-snap-align:center;border:0;background:none;padding:0;text-align:left;font:inherit;color:inherit;cursor:pointer}
.bigc .ct{position:relative;inset:auto;height:auto;min-height:420px}
.bigc .ct__ic{display:none}
/* thẻ tuần tô màu */
.wcell{display:block;aspect-ratio:1;border-radius:50%;border:1.5px dashed #D9CBA7;background:rgba(255,255,255,.55);position:relative;max-width:34px;margin:0 auto 2px}
.wcell.y{border:0;background:#D9473B}
.wcell.p{border:0;background:#F2B21B}
.wcell.today{box-shadow:0 0 0 2px var(--c-d)}
.bfdot{position:absolute;top:-2px;right:-2px;width:8px;height:8px;border-radius:50%;background:#4A4F5E;box-shadow:0 0 0 1.5px #FBF4E2}
.wnotes{margin:8px 0 0;padding:0;list-style:none;font-size:13.5px;color:#4A3F25}
.wnotes li{padding:3px 0;border-top:1px dashed #E5D8B5}
.wnotes li b{display:inline-block;width:28px;color:#8A7A55}
.wlegend{display:flex;gap:12px;font-size:12px;color:#6B5D3A;margin:0 0 6px}
.wlegend span{display:inline-flex;align-items:center;gap:5px}
.wlegend .wcell{width:14px;height:14px;margin:0;display:inline-block}
.wlegend .bfdot{width:6px;height:6px;top:-1px;right:-1px}

/* ===== TQ12: thẻ tự tạo · Sổ tay theo nhóm · hướng dẫn lần đầu ===== */
.g5{--hc:#7B5BD0;--hd:#5F43AE;--ht:#EEE9FB}
.g6{--hc:#D9731A;--hd:#B25A0E;--ht:#FDEEDD}
.g7{--hc:#D6453D;--hd:#AF332C;--ht:#FCE7E5}
.g8{--hc:#8D6E4B;--hd:#6F5436;--ht:#F1EADF}
.g9{--hc:#5B7083;--hd:#44586A;--ht:#E6ECF1}
.g10{--hc:#B7860B;--hd:#8F6808;--ht:#FBF1D2}
.ct__k--mine{display:inline-flex;align-items:center;background:var(--ht);color:var(--hd);padding:3px 11px;border-radius:999px;letter-spacing:.06em;font-weight:700}
.tkb2--mine .tb__art{background-image:linear-gradient(160deg,var(--hc),var(--hd))}
.mine{flex:1;display:flex;flex-direction:column;justify-content:center;text-align:center;padding:6px 4px}
.mine small{display:block;font-size:10px;letter-spacing:.1em;color:var(--muted);font-weight:600;margin-bottom:10px}
.mine p{font-family:var(--h);font-size:19px;line-height:1.5;color:#3E3420;font-weight:500;margin:0}
.cuprev{display:flex;align-items:center;gap:12px;background:#fff;border:1px solid var(--rule);border-radius:20px;padding:12px 14px;margin:6px 0 14px}

.cuprev b{flex:1;min-width:0;font-size:17px;line-height:1.3;word-break:break-word}
.igrid{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin:0 0 14px}
.igrid button{aspect-ratio:1;min-width:44px;border-radius:50%;border:0;background:var(--hc);box-shadow:0 3px 0 var(--hd);display:grid;place-items:center;padding:0;cursor:pointer;opacity:.5;transition:opacity .15s}
.igrid button svg{width:55%;height:55%}
.igrid button.on{opacity:1;box-shadow:0 0 0 3px var(--bg),0 0 0 5px var(--hc)}
.swrow{display:flex;gap:10px;flex-wrap:wrap;margin:0 0 6px}
.swrow button{width:44px;height:44px;border-radius:50%;border:0;background:var(--hc);box-shadow:0 3px 0 var(--hd);cursor:pointer;padding:0;color:#fff;font-weight:700;font-size:16px}
.swrow button.on{box-shadow:0 0 0 3px var(--bg),0 0 0 5px var(--hc)}
.mkrow{display:flex;align-items:center;gap:12px;width:100%;border:1.5px dashed var(--c-t2);background:#fff;border-radius:18px;padding:12px 14px;margin:12px 0 0;font:inherit;color:inherit;text-align:left;cursor:pointer}
.mkrow .mk__i{width:40px;height:40px;border-radius:50%;background:var(--c-t);color:var(--c-d);display:grid;place-items:center;flex:none}
.mkrow .mk__i svg{width:20px;height:20px}
.mk__b{flex:1;min-width:0}
.mk__b b{display:block;font-size:15px;line-height:1.3}
.mk__b small{display:block;font-size:12.5px;color:var(--muted);line-height:1.4}
.mkrow>svg{width:16px;height:16px;color:#B9B3A6;flex:none}
.mkrow.off{opacity:.6}
.setg{font-size:11.5px;letter-spacing:.1em;text-transform:uppercase;font-weight:700;color:var(--muted);margin:18px 4px 0}
.setg+.setl{margin-top:6px}
.gd{background:#fff;border:1px solid var(--rule);border-radius:20px;margin:6px 0 10px;box-shadow:0 8px 20px -18px rgba(30,34,48,.6);overflow:hidden}
.gd__bar{display:flex;align-items:center;gap:12px;width:100%;min-height:56px;border:0;background:none;padding:10px 14px;font:inherit;color:inherit;text-align:left;cursor:pointer}
.gd__ring{flex:none;width:38px;height:38px;border-radius:50%;background:var(--c-t);color:var(--c-d);display:grid;place-items:center;font-size:12px;font-weight:700}
.gd__t{flex:1;min-width:0}
.gd__t small{display:block;font-size:10.5px;letter-spacing:.1em;color:var(--muted);font-weight:600}
.gd__t b{display:block;font-size:14.5px;line-height:1.3}
.gd__bar>svg{width:16px;height:16px;color:#B9B3A6;flex:none;transition:transform .2s}
.gd.open .gd__bar>svg{transform:rotate(90deg)}
.gd__l{padding:0 14px 6px}
.gd__s{display:flex;gap:10px;align-items:flex-start;padding:9px 0;border-top:1px dashed #E8E2D4}
.gd__s>i{flex:none;width:24px;height:24px;border-radius:50%;border:1.5px dashed #CFC6B2;display:grid;place-items:center;font-style:normal;font-size:12px;font-weight:700;color:#A39B88;margin-top:1px}
.gd__s.done>i{border:0;background:var(--ok);color:#fff}
.gd__s.cur>i{border:2px solid var(--c);color:var(--c-d)}
.gd__s b{display:block;font-size:14.5px;line-height:1.35}
.gd__s span{display:block;font-size:13px;color:var(--muted);line-height:1.4}
.gd__s.done b{color:var(--muted)}
.gd__s .btn{margin-top:6px}
.gd__f{display:flex;justify-content:flex-end;padding:0 10px 8px}
.gd--done .gd__bar{cursor:default}

/* ===== TQ13: nền ngà ấm, thanh dưới to hơn, nút Check-in mới, đóng dấu một chạm, nút lật ===== */
:root{--bg:#FBFAF4;--bgm:#F8F5EE;--bg2:#F4EFE4;--bar8:calc(86px + env(safe-area-inset-bottom,0px))}
html{background:#FBFAF4}
body,body.home,body.shell{background:transparent}
body::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;background:linear-gradient(180deg,#FBFAF4 0%,#F8F5EE 55%,#F4EFE4 100%)}
body::after{background:linear-gradient(rgba(244,239,228,0),#F4EFE4 70%)}
body.home::after{background:linear-gradient(rgba(244,239,228,0),#F4EFE4 72%)}
.ahd{background:rgba(251,250,244,.92)}
.hdate{font-size:13px;font-weight:500;color:var(--muted)}
.ct{box-shadow:inset 0 0 0 7px #FFFDF7,inset 0 0 0 8.5px var(--frame),0 22px 40px -22px rgba(30,34,48,.62),0 3px 9px -3px rgba(30,34,48,.22)}
.ct__stub::before,.ct__stub::after{background:var(--bgm)}
.sheet .ct__stub::before,.sheet .ct__stub::after{background:var(--bg)}
.ct .d7{margin-bottom:14px}
@media (max-height:740px){ .ct .d7{margin-bottom:12px} }
.addt{border-color:#DCCFB3;background:#FFFDF7;color:#7A5A2E;box-shadow:0 3px 8px -6px rgba(90,60,20,.45)}
.kp3 button:active{transform:scale(.97)}
.abar{width:min(440px,calc(100vw - 20px));gap:8px}
.tabs3{padding:5px}
.tabs3 button{height:54px;font-size:11px;gap:2px}
.tabs3 button svg{width:24px;height:24px}
.ckb{height:64px;border:0;border-radius:999px;padding:0 16px 0 13px;color:#fff;background:linear-gradient(160deg,#3A86E8,#1D5FD1);box-shadow:0 10px 24px -12px rgba(29,95,209,.7),inset 0 1px 0 rgba(255,255,255,.35);backdrop-filter:none;-webkit-backdrop-filter:none}
.ckb.soon{background:linear-gradient(160deg,#3A86E8,#1D5FD1)}
.ckb.soon::after{display:none}
.ckb:not(.done)::before{content:"";position:absolute;inset:0;border-radius:inherit;animation:ckPulse 2.6s ease-out infinite;pointer-events:none}

.ckb.done{background:rgba(255,253,247,.88);color:#9A3A2F;box-shadow:0 10px 28px -16px rgba(30,34,48,.45),0 0 0 1px rgba(220,214,200,.7)}
.hold.tap{touch-action:manipulation}
.hold.tap span{font-size:12px;line-height:1.1;text-align:center}
.flipb{display:inline-flex;align-items:center;gap:5px;height:38px;padding:0 14px 0 11px;border-radius:999px;border:1px solid #DCD6C8;background:rgba(255,255,255,.8);color:var(--ink-2);font:inherit;font-size:13px;font-weight:600;cursor:pointer}
.flipb svg{width:16px;height:16px}
.flipb:active{transform:scale(.95)}
.fliprow{display:flex;justify-content:center;margin:12px 0 0}
.nep{text-align:center;font-size:12.5px;color:var(--muted);margin:8px 0 0}
.pzrow{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;margin-top:18px;padding-top:12px;border-top:1px dashed var(--rule)}
.pzrow .btn svg{width:16px;height:16px}
.mrow{background:#fff;border:1px solid var(--rule);border-radius:16px;padding:8px 6px 6px;margin:0 0 12px}
.mrow small{display:block;font-size:12.5px;font-weight:600;color:var(--ink-2);margin:0 6px 4px}
.mrow small .muted{font-weight:400}
.mrow>div{display:flex;gap:2px}
.mrow button{flex:1;min-width:0;min-height:44px;border:0;background:none;border-radius:12px;padding:4px 0;display:flex;flex-direction:column;align-items:center;font:inherit;font-size:10.5px;color:var(--muted);cursor:pointer}
.mrow button svg{width:32px;height:32px}
.mrow button.on{background:var(--c-t);color:var(--c-d);font-weight:600}
@media (prefers-reduced-motion:reduce){ .ckb::before{animation:none!important} }

/* ===== TQ14: gợi ý công thức, bài học, Shin nhận xét tuần ===== */
.sugt{display:inline-flex;align-items:center;border:1.5px dashed var(--c-t2);background:#fff;color:var(--c-d);border-radius:999px;padding:6px 14px;font:inherit;font-size:13.5px;font-weight:600;cursor:pointer;margin:0 0 10px}

 ngu:{full:true,
  poem:['Mười một giờ rồi','Màn hình tắt thôi','Giấc ngủ đủ rồi','Sáng ra tươi tỉnh'],
  why:{now:'Ngủ đủ thì sáng dậy được, học 4 tiết không gà gật, bài học cũng nhớ lâu hơn.', jp:'Ca làm ở Nhật thường bắt đầu sớm. Thiếu ngủ dễ mất tập trung, dễ làm sai, dễ gặp tai nạn.'},
  corner:'Ở công ty anh từng có bạn chơi game đến gần sáng, tuần nào cũng xin nghỉ một hai buổi, mọi người phải làm thay. Anh nhìn mà tự đặt luật: 22 giờ 30 là cắm sạc xa giường.',
  dlg:[['shin','wow','Nghe nói có người ngủ 4 tiếng mà vẫn học giỏi. Em thử được không anh?'],
       ['s','smile','Mỗi người một sức. Với tụi mình, học 4 tiết, chiều làm thêm, ngủ ít là hôm sau đuối liền.'],
       ['shin','think','Mà tối nào em cũng lỡ lướt điện thoại tới khuya…'],
       ['s','hi','Anh cũng vậy, đến khi anh cắm sạc ở góc phòng, xa giường. Muốn lướt thì phải đứng dậy, thế là lười, ngủ luôn.']],
  steps:[['Hẹn giờ tắt màn hình','Đặt báo thức 22 giờ 30 để nhắc mình.'],['Cắm sạc xa giường','Điện thoại để ở bàn học hoặc góc phòng.'],['Chuẩn bị đồ cho mai','Rồi tắt đèn, nằm xuống.']],
  dos:[['Ngủ, dậy cùng giờ mỗi ngày','Cuối tuần thức khuya, ngủ bù'],['Đọc vài trang sách giấy','Nằm lướt video trên giường']],
  oops:['Nằm lướt “một chút” thành một tiếng.','Uống cà phê, trà sữa vào buổi tối.'],

 bot:{full:true,
  poem:['Tay muốn mở game','Đổi việc khác thôi','Năm phút qua rồi','Cơn thèm cũng tan'],

  dos:[['Bớt dần từng tuần','Thề bỏ hẳn từ ngày mai'],['Để điện thoại xa lúc học','Để ngay cạnh sách vở']],
  oops:['Lỡ một hôm thì tự trách, rồi bỏ luôn.','Thay thói quen này bằng một thói quen chưa tốt khác.'],

 chitieu:{full:true,
  poem:['Một dòng chi tiêu','Tối nay ghi lại','Món thích chờ mai','Tiền về đúng chỗ'],
  why:{now:'Ghi lại mới biết tiền đi đâu. Biết rồi thì dễ để dành cho việc lớn của mình.', jp:'Sang Nhật, mỗi tháng có lương nhưng cũng nhiều khoản: nhà, ăn, đi lại. Người ghi chép đều giữ được kế hoạch gửi về nhà và để dành.'},
  corner:'Ở Nhật mình có một cuốn sổ chi tiêu. Mình hay tự nhắc: lương một tháng bao nhiêu chưa quan trọng, quan trọng là cuối tháng để dành được bao nhiêu.',
  dlg:[['shin','worry','Tiền làm thêm em vừa nhận, chưa hết tuần mà đã gần hết…'],
       ['s','smile','Chị cũng từng vậy. Tiền đi đâu không biết, toàn món nhỏ: trà sữa, đồ ăn vặt, đồ giảm giá.'],
       ['shin','think','Rồi chị làm sao?'],
       ['s','hi','Tối nào chị cũng ghi một dòng. Muốn mua gì thì hỏi: mình CẦN hay chỉ THÍCH? Món thích thì chờ một ngày. Phần lớn hôm sau là hết muốn.']],
  steps:[['Nhớ số tiền mỗi lần trả','Giữ hóa đơn hoặc ghi nhanh vào điện thoại.'],['Tối ghi 1 dòng','Món gì, bao nhiêu, CẦN hay THÍCH.'],['Món THÍCH thì chờ 1 ngày','Hôm sau vẫn cần mới mua.']],
  dos:[['Để riêng tiền thứ CẦN trước','Tiêu trước, còn bao nhiêu mới để dành'],['Tự giữ thẻ, tiền của mình','Cho mượn thẻ, nhờ người khác giữ hộ']],
  oops:['Chỉ ghi món lớn, quên những món nhỏ mỗi ngày.','Mua đồ giảm giá dù không cần, vì thấy rẻ.'],
  safe:'Không đưa thẻ ngân hàng, mật khẩu hay giấy tờ của mình cho người khác giữ. Lời mời vay tiền dễ, việc nhẹ lương cao trên mạng thường là bẫy lừa: hỏi thầy cô trước.',

 tiengnhat:{full:true,
  poem:['Một câu tiếng Nhật','Nói sai cũng được','Mỗi ngày một bước','Miệng quen tự nhiên'],
  why:{now:'Biết mà không nói thì lúc cần sẽ không nói ra được. Mỗi ngày một câu, miệng sẽ quen.', jp:'Ở chỗ làm, người Nhật quý người chịu nói, dù còn sai. Nói được thì hỏi được, học được nhanh hơn.'},
  corner:'Mới sang, công ty toàn cô chú lớn tuổi, mình ngại lắm. Mình cứ chào, hỏi một câu mỗi ngày. Họ cởi mở hỏi han lại. Trò chuyện dần, tiếng Nhật lên lúc nào không hay.',
  dlg:[['shin','worry','Em sợ nói sai lắm, gặp thầy cô người Nhật là em chỉ cười thôi…'],

  steps:[['Chọn một câu cho hôm nay','Câu chào, câu hỏi hoặc câu xin phép.'],['Nói với một người','Thầy cô, bạn cùng phòng, anh chị làm hồ sơ.'],['Sai thì nói lại','Cảm ơn người sửa, rồi nói lại câu đúng.']],
  dos:[['Nói chậm, rõ từng chữ','Nói lí nhí cho qua'],['Chưa hiểu thì hỏi lại','Gật đầu dù chưa hiểu']],
  oops:['Đợi giỏi rồi mới nói.','Chào bằng tiếng Nhật xong thì chuyển ngay sang tiếng Việt.'],
  ev:{q:'Bạn nói tiếng Nhật với ai?', o:['Thầy cô người Nhật','Thầy cô người Việt','Bạn cùng lớp','Bạn cùng phòng','Người khác']},

 quansat:{full:true,
  poem:['Mắt nhìn tai nghe','Thấy điều hay hay','Ghi lại mỗi ngày','Hỏi thêm vì sao'],
  why:{now:'Người tinh ý học được cả khi không ai dạy: nhìn người khác làm rồi tự rút ra bài học.', jp:'Ở Nhật, người mới hay được dặn 見て覚える: nhìn mà học. Ai biết quan sát thì quen việc nhanh hơn.'},
  corner:'Mới sang Nhật, tay chân mình lóng ngóng lắm. Mình tập quan sát anh chị đồng nghiệp: họ cầm dụng cụ thế nào, sắp xếp ra sao. Chưa ai dạy mà mình đã quen việc.',
  kase:{t:'Từ xưởng Nhật về cửa hàng ở quê', s:'Một anh thực tập sinh có thói quen quan sát mọi thứ quanh mình, từ hệ thống thông gió, điện, đèn trong xưởng đến cách bày hàng ở siêu thị Nhật. Về nước, anh áp dụng vào việc kinh doanh và đặt quy tắc chỉ bán đồ chất lượng để khách nhớ đến mình lâu dài.', l:'Quan sát mỗi ngày là cách học không tốn tiền, mang theo được cả đời.'},
  dlg:[['shin','think','Chưa ai dạy thì em học bằng cách nào hả chị?'],
       ['s','smile','Bằng mắt. Mới sang Nhật, tay chân chị lóng ngóng lắm. Chị nhìn anh chị đồng nghiệp làm rồi làm theo.'],
       ['shin','wow','Nhìn thôi mà học được hả chị?'],
       ['s','hi','Nhìn rồi ghi một dòng, chưa hiểu thì hỏi một câu “vì sao”. Người Nhật hay nói 見て覚える: nhìn mà học. Ai tinh ý thì quen việc nhanh hơn.']],
  steps:[['Chọn một người làm tốt','Thầy cô, bạn giỏi, anh chị làm hồ sơ.'],['Nhìn kỹ một việc nhỏ','Họ làm thế nào, theo thứ tự nào.'],['Ghi 1 dòng, hỏi 1 câu','“Vì sao làm vậy?” Hỏi lúc người đó rảnh.']],
  dos:[['Ghi điều mình làm theo được','Ghi kiểu “hôm nay đông người”'],['Hỏi lúc người kia rảnh','Hỏi chen khi họ đang bận']],
  oops:['Nhìn nhưng không ghi, hôm sau quên mất.','Tin ngay một tin trên mạng mà chưa xem ai đăng.'],

 viecko:{full:true,
  poem:['Việc khó ai làm','Em xin thử ạ','Khó rồi cũng qua','Mình lớn thêm lên'],
  why:{now:'Việc dễ ai cũng làm được. Nhận việc hơi khó là cách nhanh nhất để giỏi lên và được tin tưởng.', jp:'Ở Nhật, người hay nói やってみます (để em thử) thường được giao việc mới, học được nhiều kỹ năng hơn.'},
  corner:'Hồi ở trường, thầy hỏi ai làm trưởng nhóm thuyết trình, mình run nhưng vẫn giơ tay. Làm xong mới thấy mình làm được nhiều hơn mình nghĩ.',
  dlg:[['shin','worry','Thầy hỏi “ai làm?” mà em sợ làm không tốt, nên em ngồi im…'],

       ['shin','think','Rồi chị có làm tốt không?'],

  steps:[['Nhận ra việc mình hơi ngại','Không cần việc quá sức, chỉ hơi ngại thôi.'],['Giơ tay trước khi kịp ngại','Nói “Em xin thử ạ”.'],['Làm tới cùng, vướng thì hỏi','Xong thì báo lại kết quả.']],
  dos:[['Nhận việc hơi khó, vừa sức','Ôm việc quá sức rồi bỏ dở'],['Vướng là hỏi ngay','Im lặng làm sai rồi giấu']],

  ev:{q:'Bạn đã nhận việc gì?', o:['Trực nhật khu khó','Phát biểu trên lớp','Làm trưởng nhóm','Việc chung của lớp','Việc khác']},
  quiz:{sc:'Thầy hỏi: “Ai lên làm mẫu bài chào?” Bạn hơi ngại. Bạn làm gì?', o:['Ngồi im, để bạn khác làm.','Giơ tay: “Em xin thử ạ.”','Đợi xem có ai giơ tay trước.'], ok:1, ex:'Thử là cách học nhanh nhất. Sai trên lớp thì được sửa, sang Nhật đỡ sai hơn.'},

 horenso:{full:true,

function rotQ(q,target){ if(!q||!q.o) return; var n=q.o.length; target=target%n; var r=(q.ok-target+n)%n; if(!r) return; var o=q.o.slice(); q.o=o.map(function(_,i){ return o[(i+r)%n]; }); q.ok=target; }

  if(!st.slots || st.slots.length!==5){ var sl=[]; (st.order||[]).forEach(function(id){ var u=st.habits[id]; if(u && (u.status==='active'||u.status==='keep') && sl.length<5) sl.push(id); }); while(sl.length<5) sl.push(null); st.slots=sl; }
  if(st.v<5){ for(var k in st.habits){ if(st.habits[k].status==='keep') st.habits[k].status='active'; } }
  st.notes=st.notes||{}; st.bf=st.bf||{}; st.mood=st.mood||{}; st.prDone=st.prDone||{}; st.seen=st.seen||{};
  /* TQ12: thẻ tự tạo; người đã check-in từ trước không cần hướng dẫn lần đầu */

    else { var d=document.documentElement; var r=(d.requestFullscreen||d.webkitRequestFullscreen).call(d); if(r&&r.catch) r.catch(function(){ toast('Trình duyệt này chưa cho bật toàn màn hình.'); }); }

function shinReview(){
  var t=dk(), ws=wkStart(t), pws=addD(ws,-7), soFar=diffD(ws,t)+1, cur=0, prev=0, l=handList();
  for(var i=0;i<7;i++){ if(S.ci[addD(ws,i)]) cur++; if(S.ci[addD(pws,i)]) prev++; }
  if(!l.length && !cur && !prev) return '';
  var lines=[];
  if(prev===0 && cur>0) lines.push('Tuần này bạn đã check-in <b>'+cur+'</b> ngày. Khởi đầu đẹp!');
  else if(cur>prev) lines.push('Tuần này <b>'+cur+'</b> ngày check-in, nhiều hơn tuần trước (<b>'+prev+'</b>). Giỏi lắm!');
  else if(cur===prev) lines.push('Tuần này <b>'+cur+'</b> ngày check-in, bằng tuần trước. Giữ nhịp này nhé.');
  else lines.push(soFar<7 ? 'Tuần này mới <b>'+cur+'/'+soFar+'</b> ngày, tuần trước <b>'+prev+'/7</b>. Còn '+(7-soFar)+' ngày để gỡ lại.' : 'Tuần này <b>'+cur+'/7</b> ngày check-in, tuần trước <b>'+prev+'/7</b>. Tuần sau mình gỡ lại nhé.');
  if(l.length>1){ var cnt=l.map(function(id){ var c=0; for(var i=0;i<soFar;i++){ var m=mark(addD(ws,i),id); if(m==='y'||m==='p') c++; } return [id,c]; }).sort(function(a,b){ return b[1]-a[1]; });
    var best=cnt[0], weak=cnt[cnt.length-1];
    if(best[1]>0) lines.push('<b>'+esc(sname(best[0]))+'</b> đều nhất ('+best[1]+' ngày).');
    if(best[1]-weak[1]>=2) lines.push('<b>'+esc(sname(weak[0]))+'</b> hơi thưa, thử làm ngay khi '+esc(H(weak[0]).anchor)+' nhé.'); }
  var mood=cur>prev?'cheer':cur<prev?'think':'hi';
  return '<div class="shinrv"><div class="av">'+shin(mood)+'</div><p>'+lines.join(' ')+'</p></div>';
}

function shinWeek(ws){
  var t=dk(), pws=addD(ws,-7), cur=0, prev=0, den=7, list=trackIds(), lines=[], i, mood='hi';
  if(ws===wkStart(t)) den=diffD(ws,t)+1;
  for(i=0;i<7;i++){ if(S.ci[addD(ws,i)]) cur++; if(S.ci[addD(pws,i)]) prev++; }
  if(cur===0){ lines.push('Tuần này chưa có ngày check-in nào. Bắt đầu lại từ hôm nay nhé, chỉ cần một việc thật nhỏ.'); mood='think'; }
  else if(cur>=den && den>=5){ lines.push('Tuần này bạn check-in đủ '+cur+'/'+den+' ngày. Rất đều tay!'); mood='cheer'; }
  else if(cur>prev){ lines.push('Tuần này '+cur+'/'+den+' ngày check-in, nhiều hơn tuần trước ('+prev+'/7). Tiến bộ rồi đó!'); mood='cheer'; }
  else if(cur===prev){ lines.push('Tuần này '+cur+'/'+den+' ngày check-in, bằng tuần trước. Giữ nhịp này nhé.'); }
  else { lines.push('Tuần này '+cur+'/'+den+' ngày check-in, ít hơn tuần trước ('+prev+'/7). Không sao, chỉ cần đừng để hai ngày liền trống.'); mood='think'; }
  if(list.length){
    var cnt=list.map(function(id){ var c=0; for(var k=0;k<7;k++){ var m=mark(addD(ws,k),id); if(m==='y'||m==='p') c++; } return [id,c]; }).sort(function(a,b){ return b[1]-a[1]; });
    if(cnt[0][1]>0) lines.push(sname(cnt[0][0])+' đều nhất: '+cnt[0][1]+' ngày.');
    var wk=cnt[cnt.length-1];
    if(cnt.length>1 && cnt[0][1]-wk[1]>=2 && H(wk[0])) lines.push(sname(wk[0])+' còn thưa ('+wk[1]+' ngày). Thử làm ngay khi '+H(wk[0]).anchor+'.');
  }
  var nt=0; for(i=0;i<7;i++){ var o=S.notes[addD(ws,i)]||{}; for(var k2 in o){ if(o[k2]) nt++; } }
  if(nt>=3) lines.push('Bạn viết '+nt+' ghi chú, Shin thấy bạn đang nghiêm túc lắm.');
  var we=addD(ws,6);
  S.order.forEach(function(id){ var u=H(id); if(!u||!u.cf) return; for(var l in u.cf){ if(u.cf[l].d>=ws && u.cf[l].d<=we) lines.push(sname(id)+' vừa lên cấp '+LV_NAME[+l]+'!'); } if(u.master && u.master>=ws && u.master<=we) lines.push(sname(id)+' đã Thành nếp!'); });
  return {text:lines.join(' '), mood:mood};
}

/* =========================================================
   TQ15 · THẺ NGHIÊNG THEO NGÓN TAY (không vệt sáng, tối đa ~4°)
   ========================================================= */
var TILT=null;
function tiltSet(e){ if(!TILT) return; var r=TILT.r, x=(e.clientX-r.left)/r.width-0.5, y=(e.clientY-r.top)/r.height-0.5;
  x=Math.max(-0.5,Math.min(0.5,x)); y=Math.max(-0.5,Math.min(0.5,y));
  TILT.el.style.transform='perspective(900px) rotateX('+(-y*7).toFixed(2)+'deg) rotateY('+(x*8).toFixed(2)+'deg)'; }
function tiltEnd(){ if(!TILT) return; var el=TILT.el; el.style.transition='transform .35s cubic-bezier(.22,.9,.24,1)'; el.style.transform=''; TILT=null; }
if(window.PointerEvent){
  document.addEventListener('pointerdown',function(e){
    if(reduceMotion()) return; var el=e.target.closest && e.target.closest('.cs.cur .flip, .cardview .flip'); if(!el) return;
    if(e.target.closest('button,a,input,textarea,select')) return;
    TILT={el:el, r:el.getBoundingClientRect()}; el.style.transition='transform .12s ease-out'; tiltSet(e);
  });
  document.addEventListener('pointermove',function(e){ if(TILT){ TILT.el.style.transition='transform .06s linear'; tiltSet(e); } },{passive:true});
  ['pointerup','pointercancel'].forEach(function(t){ document.addEventListener(t,tiltEnd,true); });
  window.addEventListener('blur',tiltEnd);
}
